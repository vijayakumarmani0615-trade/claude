# =============================================================================
# Strategy configuration: EMA(8) trend-pullback -- 75-min timeframe
#
# RE-TUNED for 75-min (see scripts/ema_75m_retune.py and FINDINGS.md).
# Reusing the 15-min config verbatim came back weak (PF 1.06) because every
# bar-count parameter meant something different at 5x the bar duration, and
# 75-min bars have ~2.1x the typical high-low range of 15-min bars. This
# config keeps the same 20pt stop (still the right scale -- the entry is
# still a precise EMA touch) but:
#   - trend_slope_bars / extension_lookback_bars scaled down to stay close
#     to the same WALL-CLOCK window as the 15-min defaults (10 bars * 15min
#     ~= 2 bars * 75min), not the same bar count.
#   - target widened a lot (120pt vs 40pt) since 75-min bars swing further
#     before reversing.
# Result: PF 2.70, win 45.3%, net +11.46L, max DD -11.1%, profitable in 6 of
# 7 years -- back in the same ballpark as the 15-min result, just with a
# lower win rate / bigger R multiple. See FINDINGS.md for the full sweep
# and an even-higher-net alternative (slope=3, ext=2, 20/150).
#
# Run with:
#   python -m src.cli --config config_ema_pullback_75m.yaml --strategy ema_pullback
# =============================================================================

data:
  source: csv
  symbol: "NIFTY"
  csv_path: "data/nifty_75m.csv"
  yf_period: "60d"
  timeframe: "75m"
  session_start: "09:15"
  session_end: "15:30"
  square_off: "15:15"       # only reached exactly on 15-min bars; 75-min bars
                             # square off on the last bar of each day instead
                             # (see Backtester._compute_square_off_mask)
  intraday: true

strategy:
  ema_fast: 8
  ema_slow: 50
  trend_slope_bars: 2       # ~2 bars * 75min ~= 10 bars * 15min (wall-clock equivalent)
  touch_pct: 0.0            # literal touch/cross required (see FINDINGS.md touch_pct bug)
  require_extension: true
  extension_pct: 0.0015
  extension_lookback_bars: 1  # ~1 bar * 75min ~= 6 bars * 15min

risk:
  capital: 200000
  sizing_method: fixed_lot
  lot_size: 75
  lots: 1
  sl_method: fixed
  sl_buffer_pct: 0.0010
  atr_period: 14
  atr_mult: 1.5
  sl_fixed_points: 20        # same scale as 15-min -- the entry is still a precise EMA touch
  target_method: fixed
  rr_multiple: 1.5
  target_fixed_points: 120   # widened a lot (was 40) -- 75-min bars swing further before reversing
  max_trades_per_day: 1
  one_position_at_a_time: true
  margin_pct: 0.12
  margin_buffer_pct: 0.30

costs:
  slippage_pct: 0.00015
  brokerage_per_trade: 40
  entry_touch_extra_slippage_points: 0

backtest:
  entry: signal_level
  sl_priority: true

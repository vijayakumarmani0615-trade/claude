# =============================================================================
# Strategy configuration
#
# Strategy: Support/Resistance rejection on index 15-min candles.
#   Two setups (both can be on at once):
#     - reversal    : price pushes INTO a level and gets rejected (bounce)
#     - false_break : price pokes BEYOND a level but closes back inside (trap)
#
# Everything below is tunable. Start with defaults, then adjust after you see
# the first backtest report and compare it to how you actually read charts.
# =============================================================================

data:
  source: synthetic          # synthetic | csv | yfinance
  symbol: "^NSEI"            # yfinance ticker. ^NSEI = Nifty 50, ^NSEBANK = Bank Nifty
  csv_path: "data/index_15m.csv"  # used when source == csv
  yf_period: "60d"          # yfinance intraday history window (max ~60d for 15m)
  timeframe: "15m"
  session_start: "09:15"    # exchange session (IST)
  session_end: "15:30"
  square_off: "15:15"       # intraday hard exit time
  intraday: true            # true = flatten every day at square_off

levels:
  method: both              # swing | pivots | both
  swing_left: 3             # bars to the left for a swing pivot
  swing_right: 3            # bars to the right (confirmation delay)
  lookback_bars: 300        # keep swing levels formed within this many bars
  zone_pct: 0.0015          # merge levels within 0.15% into one zone
  touch_pct: 0.0015         # price within 0.15% of a level counts as a "touch"
  max_levels: 8             # cap active levels per side (nearest kept)

strategy:
  setups:
    reversal: true
    false_break: true
  break_buffer_pct: 0.0010  # move beyond level (0.10%) that counts as a "break"
  require_close_confirm: true  # signal bar must close back on the correct side
  require_rejection_wick: false  # require a wick rejecting the level

risk:
  capital: 1000000          # starting capital (INR)
  risk_per_trade_pct: 1.0   # % of capital risked per trade (sizes the quantity)
  sl_method: structure      # structure | atr | fixed
  sl_buffer_pct: 0.0010     # extra buffer beyond the structural stop
  atr_period: 14
  atr_mult: 1.5             # SL distance = atr_mult * ATR  (sl_method: atr)
  sl_fixed_points: 30       # SL distance in index points  (sl_method: fixed)
  target_method: rr         # rr | level | fixed
  rr_multiple: 1.5          # target = rr_multiple * risk    (target_method: rr)
  target_fixed_points: 45   # target distance in points      (target_method: fixed)
  max_trades_per_day: 3
  one_position_at_a_time: true

costs:
  slippage_pct: 0.0002      # per side (0.02%)
  brokerage_per_trade: 40   # flat INR, round-trip (entry + exit)

backtest:
  entry: next_open          # next_open (realistic) | signal_close
  sl_priority: true         # if SL and target both hit in one bar, assume SL first
